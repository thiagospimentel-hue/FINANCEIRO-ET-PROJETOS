<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financeiro • Protótipo</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#1a1d23;--muted:#6b7280;--border:#e3e5e9;--accent:#2563eb;--accent-bg:#eaf0fe;--good:#16a34a;--bad:#dc2626;--head:#c9d9f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14161a;--panel:#1d2026;--text:#eceef1;--muted:#9aa1ac;--border:#2c2f36;--accent:#5b8def;--accent-bg:#1f2a44;--head:#26314d;}}
:root[data-theme="dark"]{--bg:#14161a;--panel:#1d2026;--text:#eceef1;--muted:#9aa1ac;--border:#2c2f36;--accent:#5b8def;--accent-bg:#1f2a44;--head:#26314d;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 40px;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5;padding-top:calc(12px + env(safe-area-inset-top,0px));}
.topbar h1{font-size:16px;margin:0;}
.who{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;}
.who button{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text);font-size:12px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.card h2{margin:0 0 10px;font-size:15px;}
.card h3{margin:14px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;}
th{color:var(--muted);font-weight:600;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.hdr{background:var(--head);font-weight:700;}
.pos{color:var(--good);} .neg{color:var(--bad);}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
.tabs button{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:13px;color:var(--muted);white-space:nowrap;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.row-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
input[type=text],input[type=search],input[type=number],input[type=date],textarea,select{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;padding:6px 8px;font-size:13px;}
.pct-input{width:60px;}
.val-input{width:110px;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 12px;font-size:13px;}
.btn.secondary{background:var(--accent-bg);color:var(--accent);}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad);padding:4px 8px;font-size:12px;}
.login{max-width:380px;margin:60px auto;text-align:center;}
.login .btn{width:100%;margin-top:8px;}
.muted{color:var(--muted);font-size:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr;}}
.small{font-size:12px;color:var(--muted);}
.field{display:flex;flex-direction:column;gap:2px;}
.field label{font-size:11px;color:var(--muted);}
.field input,.field textarea,.field select{width:100%;}
.coordbox{background:var(--accent-bg);border-radius:8px;padding:10px;margin:10px 0;}
.servbox{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;}
.equipe-row{display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap;}
.badge-andamento{background:#fef3c7;color:#92400e;}
.badge-concluida{background:#dbeafe;color:#1e40af;}
.badge-faturada{background:#dcfce7;color:#166534;}
.badge-cancelada{background:#fee2e2;color:#991b1b;}
:root:not([data-theme="light"]) .badge-andamento,:root[data-theme="dark"] .badge-andamento{background:#452d09;color:#fcd34d;}
:root:not([data-theme="light"]) .badge-concluida,:root[data-theme="dark"] .badge-concluida{background:#1e2f4d;color:#93c5fd;}
:root:not([data-theme="light"]) .badge-faturada,:root[data-theme="dark"] .badge-faturada{background:#123322;color:#86efac;}
:root:not([data-theme="light"]) .badge-cancelada,:root[data-theme="dark"] .badge-cancelada{background:#3d1616;color:#fca5a5;}
.orcbox{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin:10px 0;}
@media(max-width:560px){.orcbox{grid-template-columns:1fr;}}
.barwrap{background:var(--border);border-radius:6px;height:8px;overflow:hidden;margin-top:4px;}
.barfill{height:100%;background:var(--accent);}
.rankcard{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.resumoTable{margin:10px 0;}
.resumoTable th{background:#f6cf4c;color:#3a2e00;text-align:center;font-size:13px;padding:8px;}
.resumoTable td{padding:7px 10px;}
.resumoTable tr.resumoTotal td{background:#22c55e;color:#063d1c;font-weight:700;}
:root:not([data-theme="light"]) .resumoTable th,:root[data-theme="dark"] .resumoTable th{background:#8a6d14;color:#fff7dc;}
:root:not([data-theme="light"]) .resumoTable tr.resumoTotal td,:root[data-theme="dark"] .resumoTable tr.resumoTotal td{background:#145c2c;color:#d8ffe6;}

/* ===== Visual de aplicativo (desktop) — cores via variáveis: troque --brand/--accent para a paleta oficial da ET ===== */
:root{--brand:#0f2a43;--brand-2:#173a5a;--brand-text:#c9d6e3;--accent:#1d6fa5;--accent-bg:#e6f0f8;--head:#dbe8f3;--bg:#f3f5f8;--shadow:0 1px 2px rgba(15,42,67,.06),0 4px 14px rgba(15,42,67,.05);}
:root[data-theme="dark"]{--accent:#4a9bd4;--accent-bg:#1b2f44;--head:#213a52;--shadow:none;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#4a9bd4;--accent-bg:#1b2f44;--head:#213a52;--shadow:none;}}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh;}
.shell.nosidebar{grid-template-columns:1fr;}
.side{background:var(--brand);color:var(--brand-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:#fff;}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.02em;}
.brand{flex-direction:column;align-items:flex-start;gap:8px;padding:6px 10px 20px;} .brand img{width:104px;display:block;} .brand span{font-size:11px;color:var(--brand-text);opacity:.75;}
.side .tabs{display:flex;flex-direction:column;gap:2px;margin:0;overflow:visible;}
.side .tabs button{display:flex;align-items:center;gap:11px;background:none;border:none;border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--brand-text);text-align:left;white-space:normal;}
.side .tabs button svg{width:18px;height:18px;flex:none;opacity:.85;}
.side .tabs button:hover{background:rgba(255,255,255,.07);color:#fff;}
.side .tabs button.active{background:var(--accent);color:#fff;font-weight:600;}
.side .tabs button.active svg{opacity:1;}
.badgeN{margin-left:auto;background:#f59e0b;color:#1a1200;font-style:normal;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px;}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;display:flex;flex-direction:column;gap:8px;}
.side-foot .user{color:#fff;font-weight:600;font-size:13px;}
.side-foot button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--brand-text);border-radius:7px;padding:6px 9px;font-size:12px;text-align:left;}
.side-foot button:hover{background:rgba(255,255,255,.16);color:#fff;}
.side-foot .row{display:flex;gap:6px;} .side-foot .row button{flex:1;text-align:center;}
#syncChip{font-size:11.5px;color:var(--brand-text);}
.main{min-width:0;}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 28px 0;max-width:1280px;margin:0 auto;}
.pagehead h1{font-size:22px;margin:0;letter-spacing:-.01em;}
.pagehead .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.nosidebar .pagehead .who button{background:var(--panel);}
.main .wrap{max-width:1280px;padding:16px 28px 48px;}
.card{border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;}
.card h2{font-size:15.5px;letter-spacing:-.005em;}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;}
tbody tr:hover td,table tr:not(.hdr):hover td{background:color-mix(in srgb,var(--accent) 5%,transparent);}
.btn{border-radius:8px;padding:8px 14px;font-weight:600;transition:filter .12s,transform .05s;}
.btn:hover{filter:brightness(1.08);} .btn:active{transform:translateY(1px);}
.btn.danger{font-weight:500;}
input[type=text],input[type=search],input[type=number],input[type=date],textarea,select{border-radius:8px;padding:7px 10px;}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent);}
.servbox{border-radius:10px;}
td.num{white-space:nowrap;}
.who #syncChip{color:var(--muted);}
.loginpage{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh;}
.loginbrand{background:linear-gradient(155deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:60px;}
.loginbrand .logo{width:54px;height:54px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:22px;}
.loginbrand h1{font-size:30px;margin:0 0 10px;letter-spacing:-.02em;} .loginbrand p{color:var(--brand-text);max-width:380px;line-height:1.55;margin:0;}
.loginform{display:flex;flex-direction:column;justify-content:center;padding:60px;max-width:520px;width:100%;margin:0 auto;}
.loginform .card{margin-bottom:16px;} .loginform .btn{width:100%;margin-top:8px;}
@media(max-width:900px){.shell{grid-template-columns:1fr;} .side{position:static;height:auto;} .side .tabs{flex-direction:row;flex-wrap:wrap;} .loginpage{grid-template-columns:1fr;} .loginbrand{padding:30px;}}

/* ===== Área do colaborador ===== */
.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);}
.avatar{color:#fff;width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none;border:2px solid rgba(255,255,255,.25);}
.hero h2{margin:0;font-size:21px;color:#fff;letter-spacing:-.01em;} .hero .cargo{color:var(--brand-text);font-size:13px;margin-top:2px;}
.hero .prog{flex:1;min-width:260px;} .hero .prog .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--brand-text);margin-bottom:6px;}
.hero .bar{height:9px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden;} .hero .bar i{display:block;height:100%;background:#4ade80;border-radius:6px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--accent);}
.kpi .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;} .kpi .v{font-size:21px;font-weight:700;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.kpi.ok{border-left-color:var(--good);} .kpi.warn{border-left-color:#f59e0b;} .kpi.bad{border-left-color:var(--bad);}
.aviso{display:flex;gap:10px;align-items:center;background:var(--accent-bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:13px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chip{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:6px 13px;font-size:12.5px;color:var(--muted);}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;} .chip .n{opacity:.75;margin-left:4px;}
.obracard{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
.obrahead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;background:var(--accent-bg);border-bottom:1px solid var(--border);}
.obrahead b{font-size:15px;} .obrahead .res{font-size:12.5px;color:var(--muted);}
.etapa{display:grid;grid-template-columns:1.6fr .5fr .8fr .9fr 1.2fr;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);font-size:13.5px;}
.etapa:last-child{border-bottom:none;} .etapa:hover{background:color-mix(in srgb,var(--accent) 4%,transparent);}
.etapa .nome{font-weight:600;} .etapa .sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.pill.pendente{background:#e5e7eb;color:#374151;} .pill.aguardando{background:#fef3c7;color:#92400e;} .pill.receber{background:#dbeafe;color:#1e40af;} .pill.pago{background:#dcfce7;color:#166534;}
:root[data-theme="dark"] .pill.pendente{background:#2c2f36;color:#d1d5db;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.pendente{background:#2c2f36;color:#d1d5db;} :root:not([data-theme="light"]) .pill.aguardando{background:#452d09;color:#fcd34d;} :root:not([data-theme="light"]) .pill.receber{background:#1e2f4d;color:#93c5fd;} :root:not([data-theme="light"]) .pill.pago{background:#123322;color:#86efac;}}
.concl{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12.5px;cursor:pointer;background:var(--bg);}
.concl:hover{border-color:var(--accent);} .concl.on{background:#dcfce7;border-color:#86efac;color:#166534;} .concl.lock{cursor:default;opacity:.85;}
.concl input{width:16px;height:16px;margin:0;}
.vazio{text-align:center;padding:36px 16px;color:var(--muted);font-size:13.5px;}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr;} .etapa{grid-template-columns:1fr 1fr;}}
</style>

<body>
<div id="app"></div>
<script>
const LS_KEY='financeiro_proto_v4';
const hojeISO=()=>new Date().toISOString().slice(0,10);
const novoId=p=>p+Date.now()+Math.random().toString(36).slice(2,6);
// Dinheiro sempre em centavos inteiros nas somas/comparações; arredondamento comercial (meio para cima) em 2 casas.
const c2=v=>Math.round((Number(v)||0)*100+(v<0?-1e-9:1e-9));
const r2=v=>c2(v)/100;
const baixaTotal=it=>(it.baixas||[]).reduce((s,b)=>s+c2(b.valor),0)/100;
const quemFez=()=>(typeof SB!=='undefined'&&SB.perfil&&SB.perfil.email)||'local';
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const temValor=v=>v!==undefined&&v!==null;

// ===== Sincronização com o banco compartilhado do artifact (db) =====
// Cada obra e cada lançamento do caixa é um documento; tipos/colaboradores/empresas ficam em cfg/main.
const PRE_KEY=LS_KEY+'_prenuvem';
let LOADED_FROM_LS=false;
const SYNC={state:'local',db:null,last:{},busy:false,timer:null,again:false,initialized:false,renderPending:false,retry:null,remote:{cfg:null,obras:{},caixa:{},contas:{}},got:{},pend:null,gen:0,lastF:{}};
const SYNC_LABEL={local:'💾 Só neste navegador',saving:'☁ Salvando…',ok:'☁ Salvo',error:'⚠ Não salvou — tentando de novo',conflict:'⛔ Conflito de edição'};
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((a,key)=>(a[key]=x[key],a),{}):x);
const safeId=s=>String(s).replace(/[^A-Za-z0-9_.~:@+-]/g,'_');
function setSync(st,err){
  SYNC.state=st; if(err) console.warn('sync:',err&&err.code,err&&err.message);
  const el=document.getElementById('syncChip'); if(el){ el.textContent=(SYNC_LABEL[st]||'')+((st==='error'||st==='conflict')&&SYNC.pend?' ('+SYNC.pend.ops.length+' alteração(ões) pendente(s))':''); el.style.cursor=st==='conflict'?'pointer':''; el.onclick=st==='conflict'?sbConflitoUI:null; }
  if(st==='conflict') sbConflitoUI();
}
function docsFromData(d){
  const m={};
  m['cfg/main']=canon({tiposServico:d.tiposServico||[],colaboradores:d.colaboradores||[],minhasEmpresas:d.minhasEmpresas||[],historico:(d.historico||[]).slice(0,300),incc:d.incc||[],despesasFixas:d.despesasFixas||[]});
  (d.obras||[]).forEach(o=>{m['obras/'+safeId(o.id)]=canon(o);});
  (d.caixa||[]).forEach(c=>{m['caixa/'+safeId(c.id)]=canon(c);});
  (d.contas||[]).forEach(c=>{m['contas/'+safeId(c.id)]=canon(c);});
  return m;
}
function dataFromDocs(m){
  const cfg=m['cfg/main']?JSON.parse(m['cfg/main']):{};
  const d={tiposServico:cfg.tiposServico||[],colaboradores:cfg.colaboradores||[],minhasEmpresas:cfg.minhasEmpresas||[],historico:cfg.historico||[],incc:cfg.incc||[],despesasFixas:cfg.despesasFixas||[],obras:[],caixa:[],contas:[]};
  const cmp=(a,b)=>a.localeCompare(b,undefined,{numeric:true});
  Object.keys(m).sort(cmp).forEach(p=>{ if(p.startsWith('obras/')) d.obras.push(JSON.parse(m[p])); else if(p.startsWith('caixa/')) d.caixa.push(JSON.parse(m[p])); else if(p.startsWith('contas/')) d.contas.push(JSON.parse(m[p])); });
  return d;
}
const sameMap=(a,b)=>{const ka=Object.keys(a),kb=Object.keys(b); return ka.length===kb.length && ka.every(k=>a[k]===b[k]);};
function syncSchedule(){
  if(!SYNC.db) return;
  setSync('saving');
  clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(()=>{SYNC.timer=null; syncFlush();},500);
}
async function syncFlush(){
  if(SB.on) return sbFlush();
  if(SYNC.busy){ SYNC.again=true; return; }
  SYNC.busy=true; let falhou=false;
  try{
    do{
      SYNC.again=false;
      const cur=docsFromData(DATA);
      const writes=Object.keys(cur).filter(p=>SYNC.last[p]!==cur[p]);
      const dels=Object.keys(SYNC.last).filter(p=>!(p in cur));
      for(const p of writes){ await SYNC.db.doc(p).set(JSON.parse(cur[p])); SYNC.last[p]=cur[p]; }
      for(const p of dels){ await SYNC.db.doc(p).delete(); delete SYNC.last[p]; }
    }while(SYNC.again);
    setSync('ok');
  }catch(e){
    falhou=true; setSync('error',e);
    clearTimeout(SYNC.retry); SYNC.retry=setTimeout(()=>{ if(SYNC.db) syncSchedule(); },15000);
  }
  SYNC.busy=false;
  if(!falhou) syncApplyRemote();
}
function incomingMap(){
  const r=SYNC.remote, m={};
  if(r.cfg) m['cfg/main']=r.cfg;
  Object.assign(m,r.obras,r.caixa,r.contas);
  return m;
}
function applyIncoming(m){
  DATA=dataFromDocs(m); ensureTiposPadrao(DATA);
  if(!SB.on){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){} }
}
function syncRender(){
  const a=document.activeElement;
  if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){ SYNC.renderPending=true; return; }
  render();
}
document.addEventListener('focusout',()=>{
  if(!SYNC.renderPending) return;
  setTimeout(()=>{ const a=document.activeElement; if(SYNC.renderPending && !(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))){ SYNC.renderPending=false; render(); } },80);
});
function syncApplyRemote(){
  if(!SYNC.initialized||SYNC.busy||SYNC.timer||SYNC.again||SYNC.pend||SYNC.estado==='conflict') return;
  const m=incomingMap();
  if(sameMap(m,SYNC.last)){ if(SYNC.state==='saving') setSync('ok'); return; }
  SYNC.last=m; applyIncoming(m); setSync('ok'); syncRender();
}

function ciTipoSugerido(txt){
  const t=String(txt||'').toLowerCase();
  const mapa=[[/el[eé]tric/,'Elétrica'],[/spda|para-?raio/,'SPDA'],[/sdai|inc[eê]ndio|alarme/,'SDAI'],[/subesta/,'Subestação'],[/sistemas|dados|telecom|cftv/,'Sistemas']];
  for(const [re,nome] of mapa){ if(re.test(t)){ const x=DATA.tiposServico.find(s=>s.nome===nome); if(x) return x.id; } }
  return DATA.tiposServico[0]?.id||'';
}
function ciEmpresaPorCnpj(cnpj){
  const d=String(cnpj||'').replace(/\D/g,''); if(!d) return '';
  return (DATA.minhasEmpresas.find(e=>String(e.cnpj||'').replace(/\D/g,'')===d)||{}).id||'';
}
function ciPctDasParcelas(parcelas,total){
  const t=total||parcelas.reduce((s,p)=>s+p.valor,0)||1;
  const pcts=parcelas.map(p=>Math.round(p.valor/t*1e6)/1e4);
  const dif=Math.round((100-pcts.reduce((a,b)=>a+b,0))*1e4)/1e4;
  if(pcts.length && Math.abs(dif)<0.05) pcts[pcts.length-1]=Math.round((pcts[pcts.length-1]+dif)*1e4)/1e4;
  return pcts;
}

function coordPctTotal(c){ return (c.etapas||[]).reduce((s,e)=>s+(e.pct||0),0); }
function migrarEtapasSimples(etapas){
  return (etapas||[]).map(e=>{
    if(e.status!==undefined){
      // formato intermediário (com status de NF) — volta para concluído/pendente simples
      const concluido = e.status!=='pendente';
      return {nome:e.nome,pct:e.pct,concluido,data:concluido?(e.dataPagamento||e.dataSolicitacao||''):''};
    }
    return {nome:e.nome,pct:e.pct,concluido:!!e.concluido,data:e.data||''};
  });
}
function ensureTiposPadrao(d){
  const padrao=['Elétrica','Sistemas','SPDA','SDAI','Subestação','Outros'];
  padrao.forEach(nome=>{
    if(!d.tiposServico.some(t=>t.nome.toLowerCase()===nome.toLowerCase())){
      d.tiposServico.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,6),nome});
    }
  });
  if(!d.minhasEmpresas) d.minhasEmpresas=[];
  (d.obras||[]).forEach((o,i)=>{
    if(!o.codigo) o.codigo='OBRA-'+String(i+1).padStart(3,'0');
    if(!o.status) o.status='andamento';
    if(o.dataInicio===undefined) o.dataInicio='';
    if(o.dataPrevisao===undefined) o.dataPrevisao='';
    if(o.empresaId===undefined) o.empresaId='';
    if(o.cliente){
      if(o.cliente.construtora===undefined){
        const antigo=(d.construtoras||[]).find(c=>c.id===o.cliente.construtoraId);
        o.cliente.construtora=antigo?antigo.nome:'';
      }
      delete o.cliente.construtoraId;
      if(o.cliente.spe===undefined) o.cliente.spe='';
    }
    if(!o.etapasPagamento) o.etapasPagamento=etapasPadrao();
    o.etapasPagamento.forEach(e=>{
      if(e.nfNumero===undefined) e.nfNumero='';
      if(e.nfData===undefined) e.nfData='';
      if(e.vencimento===undefined) e.vencimento='';
    });
    (o.servicos||[]).forEach(s=>{
      const liquidoServ=s.valorTotal-s.valorTotal*((s.imposto||0)/100);
      const migradasDeDespesa=[];
      s.despesas=(s.despesas||[]).filter(dp=>{
        if(dp.colaboradorId){
          // despesa antiga vinculada a um colaborador vira um membro de equipe com valor combinado + etapas fixas
          const valorCombinado=liquidoServ*((dp.pct||0)/100);
          const etapas=etapasCoordPadrao();
          if(dp.concluido){ etapas.forEach(e=>{e.concluido=true; e.data=dp.data||new Date().toISOString().slice(0,10);}); }
          migradasDeDespesa.push({colaboradorId:dp.colaboradorId,valorCombinado,etapas});
          return false;
        }
        delete dp.colaboradorId; delete dp.concluido; delete dp.data;
        return true;
      });
      s.atribuicoes=(s.atribuicoes||[]).map(a=>{
        if(a.etapas && a.valorCombinado!==undefined){ a.etapas=migrarEtapasSimples(a.etapas); return a; }
        const valorCombinado=a.valorCombinado!==undefined ? a.valorCombinado : liquidoServ*((a.pct||0)/100);
        const etapas=etapasCoordPadrao();
        if(a.concluido){ etapas.forEach(e=>{e.concluido=true; e.data=a.data||new Date().toISOString().slice(0,10);}); }
        return {colaboradorId:a.colaboradorId||'',valorCombinado,etapas};
      }).concat(migradasDeDespesa);
    });
    (o.coordenadores||[]).forEach(c=>{
      if(!c.etapas){
        const etapas=etapasCoordPadrao();
        if(c.pct) etapas[0].pct=c.pct; // preserva o valor antigo na 1ª etapa; redistribua conforme necessário
        c.etapas=etapas;
        delete c.pct;
      } else if(c.etapas.length!==ETAPAS_COORD.length || c.etapas.some((e,i)=>e.nome!==ETAPAS_COORD[i])){
        // migra para o novo conjunto fixo de etapas (Projeto Básico 30%, Pré-Executivo 30%, Executivo 30%, Revisão de Executivo 10%)
        const antigas=c.etapas;
        c.etapas=etapasCoordPadrao().map(nova=>{
          const velha=antigas.find(e=>e.nome===nova.nome);
          if(!velha) return nova;
          if(velha.status!==undefined) return {nome:nova.nome,pct:nova.pct,concluido:velha.status!=='pendente',data:velha.status!=='pendente'?(velha.dataPagamento||velha.dataSolicitacao||''):''};
          return {nome:nova.nome,pct:nova.pct,concluido:!!velha.concluido,data:velha.data||''};
        });
      } else {
        c.etapas=migrarEtapasSimples(c.etapas);
      }
      if(c.valorCombinado===undefined) c.valorCombinado=0;
    });
    // consolida coordenadores (obra) + equipe de cada serviço em uma única "Equipe da obra",
    // convertendo o antigo valor combinado (R$) em percentual sobre o líquido total da obra
    if(!o.equipe){
      const liquidoObra=(o.servicos||[]).reduce((s,sv)=> s + (sv.valorTotal-sv.valorTotal*((sv.imposto||0)/100)), 0);
      const tipoNomeLocal=id=>{ const t=(d.tiposServico||[]).find(x=>x.id===id); return t?t.nome:''; };
      const membros=[];
      (o.coordenadores||[]).forEach((c,ci)=>{

function migrarBaixas(d){

function normalizarNomeEtapa(nome){
  return (nome||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^projeto\s+/,'').replace(/[^a-z]/g,' ').replace(/\s+/g,' ').trim();

function etapaContratoIdxDe(obra, nomeColab){
  const n=normalizarNomeEtapa(nomeColab);
  const etapas=obra.etapasPagamento||[];
  const fi=pred=>etapas.findIndex(e=>!e.aditivoId && pred(normalizarNomeEtapa(e.nome)));
  if(n.includes('pre executivo')) return fi(x=>x.includes('pre executivo'));
  if(n.includes('executivo')) return fi(x=>x.includes('executivo') && !x.includes('pre'));
  if(n.includes('basico')) return fi(x=>x.includes('basico'));
  if(n.includes('legal')) return fi(x=>x.includes('legal'));

}
function resumoEtapasObra(obra){

    return {idx:i,id:e.id,aditivoId:e.aditivoId,nome:e.nome,pct:e.pct,pago:!!e.pago,data:e.data||'',nfNumero:e.nfNumero||'',nfData:e.nfData||'',vencimento:e.vencimento||'',

    let idx=-1;
    if(etapaContratoId) idx=(obra.etapasPagamento||[]).findIndex(x=>x.id===etapaContratoId);
    if(idx<0) idx=etapaContratoIdxDe(obra, nomeColab);
    if(idx<0 || !etapas[idx]) return;
    etapas[idx].totalDeliv++;
    if(concluido) etapas[idx].concluidos++;
    etapas[idx].itens.push({colaboradorId,concluido,servicoNome});
  }
  (obra.equipe||[]).forEach(m=>{
    (m.etapas||[]).forEach(e=>{ if(e.pct) registra(e.nome, m.colaboradorId, !!(e.concluido&&e.aprovado), m.papel||'Equipe', e.etapaContratoId); });

    else if(e.concluidos>0) e.status='parcial';
    else e.status='pendente';

}

function genSenha(){ const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789'; const r=crypto.getRandomValues(new Uint32Array(10)); return Array.from(r,x=>a[x%a.length]).join(''); }
function conviteTexto(c){
  return 'Olá, '+(c.nome||'').split(' ')[0]+'! Você foi convidado(a) para o sistema financeiro da ET Engenharia e Projetos.\n\nAcesse: '+location.origin+location.pathname+'\nE-mail: '+c.email+'\nSenha inicial: '+c.senha+'\n\nNo primeiro acesso, troque a senha em "Alterar senha".';
}
function conviteBox(){
  if(SB.on && CONVITE_EMAIL){ const c=CONVITE_EMAIL; return `<div class="card" style="border-color:var(--ok,#1a7f4b);"><h2>${c.reenvio?'Link reenviado':'Convite enviado'}</h2><p class="small">Enviamos um e-mail para <b>${esc(c.email)}</b>. ${esc(c.nome.split(' ')[0])} deve abrir o link, criar a senha e já entra no sistema. Se não chegar em alguns minutos, peça para olhar a caixa de spam.</p><button class="btn secondary" id="cvEmailFechar">Fechar</button></div>`; }
  if(!SB.on || !CONVITE_ATUAL) return '';
  const c=CONVITE_ATUAL;
  return `<div class="card" style="border-color:var(--ok,#1a7f4b);"><h2>Convite pronto — ${esc(c.nome)}</h2>
    <p class="small">O acesso foi criado. Copie a mensagem abaixo e envie ao colaborador. <b>A senha só aparece aqui agora</b>; depois de fechar, você pode gerar outra em "Redefinir senha".</p>
    <textarea id="cvTexto" readonly rows="7" style="width:100%;">${esc(conviteTexto(c))}</textarea>
    <div class="row-flex" style="margin-top:8px;"><button class="btn" id="cvCopiar">Copiar convite</button>
      <button class="btn secondary" id="cvZap">Enviar por WhatsApp</button>
      <button class="btn secondary" id="cvFechar">Fechar</button></div></div>`;
}
function convidarCard(){
  if(!SB.on) return '';
  return `<div class="card"><h2>Convidar colaborador</h2>
    <p class="small">Cadastra a pessoa e cria o login dela.</p>
    <div class="grid2">
      <div class="field"><label>Nome</label><input type="text" id="cvNome" placeholder="Nome completo"></div>
      <div class="field"><label>E-mail (será o login)</label><input type="email" id="cvEmail" placeholder="email@exemplo.com"></div>
      <div class="field"><label>Cargo / função</label><input type="text" id="cvCargo" placeholder="Ex: Projetista Elétrico"></div>
      <div class="field"><label>WhatsApp (opcional)</label><input type="text" id="cvTel" placeholder="(00) 00000-0000"></div>
    </div>
    <div class="row-flex" style="margin-top:10px;"><button class="btn" id="cvEmailBtn">Convidar por e-mail</button> <button class="btn secondary" id="cvConvidar">Gerar senha e convite manual</button></div>
    <p class="small muted">Por e-mail: a pessoa recebe um link e define a própria senha. Manual: o sistema gera uma senha e você envia a mensagem (WhatsApp, por exemplo).</p>
    <p class="small" id="cvMsg" style="min-height:18px;margin:8px 0 0;"></p></div>`;
}
function acessoBox(u){
  if(!SB.on) return '';
  const ac=(SB.acessos||[]).find(a=>a.colaborador_id===u.id);
  if(ac) return `<div class="card" style="background:var(--bg-soft,#f4f7fa);margin-top:10px;"><h3 style="margin:0 0 6px;">Acesso ao sistema</h3>
    <p class="small">✔ Tem login: <b>${esc(ac.email)}</b></p>
    <div class="row-flex"><input type="text" class="acSenha" data-u="${esc(u.id)}" placeholder="Nova senha (vazio = gerar)" style="min-width:230px;">
      <button class="btn secondary acReset" data-u="${esc(u.id)}" data-e="${esc(ac.email)}">Redefinir senha</button>
      <button class="btn secondary acMail" data-u="${esc(u.id)}" data-e="${esc(ac.email)}">Enviar link por e-mail</button>
      <button class="btn danger acDel" data-u="${esc(u.id)}" data-e="${esc(ac.email)}">Remover acesso</button></div>
    <p class="small acMsg" data-u="${esc(u.id)}"></p></div>`;
  return `<div class="card" style="background:var(--bg-soft,#f4f7fa);margin-top:10px;"><h3 style="margin:0 0 6px;">Acesso ao sistema</h3>
    <p class="small">Sem login ainda. Informe o e-mail e uma senha inicial e repasse ao colaborador; ele poderá trocá-la depois.</p>
    <div class="row-flex"><input type="text" class="acEmail" data-u="${esc(u.id)}" placeholder="E-mail de login" value="${esc(u.email||'')}" style="min-width:230px;">
      <input type="text" class="acSenha" data-u="${esc(u.id)}" placeholder="Senha inicial (vazio = gerar)" style="min-width:230px;">
      <button class="btn acNovo" data-u="${esc(u.id)}">Criar acesso</button></div>
    <p class="small acMsg" data-u="${esc(u.id)}"></p></div>`;
}
function loginView(){
  if(SB.on) return `<div class="loginpage">
    <div class="loginbrand"><img src="${LOGO_ET}" alt="ET Engenharia e Projetos" style="width:170px;margin-bottom:28px;"><h1>Financeiro</h1><p>Obras, cobranças, caixa e pagamentos da equipe em um só lugar — no lugar das planilhas.</p></div>
    <div class="loginform">
      <h2 style="margin:0 0 4px;font-size:20px;">Bem-vindo</h2>
      <p class="muted" style="margin:0 0 18px;">Entre com o seu e-mail e a sua senha.</p>
      <form id="loginForm" class="card" autocomplete="on">
        <label class="small">E-mail</label>
        <input type="email" id="lgEmail" autocomplete="username" required style="width:100%;margin-bottom:10px;">
        <label class="small">Senha</label>
        <input type="password" id="lgSenha" autocomplete="current-password" required style="width:100%;margin-bottom:12px;">
        <label class="small" style="display:flex;gap:6px;align-items:center;margin:0 0 10px;"><input type="checkbox" id="lgManter"> Manter conectado neste computador</label>
        <button class="btn" id="lgBtn" type="submit" style="width:100%;">Entrar</button>
        <p class="small" id="lgMsg" style="color:var(--bad);min-height:18px;margin:10px 0 0;">${esc(SB.aviso||'')}</p>
        <p class="small muted">Esqueceu a senha? Peça ao administrador para redefinir.</p>
      </form>
    </div></div>`;
  const opts=DATA.colaboradores.map(u=>`<option value="${esc(u.id)}">${esc(u.nome)}</option>`).join('');
  return `<div class="loginpage">
    <div class="loginbrand"><img src="${LOGO_ET}" alt="ET Engenharia e Projetos" style="width:170px;margin-bottom:28px;"><h1>Financeiro</h1><p>Obras, cobranças, caixa e pagamentos da equipe em um só lugar — no lugar das planilhas.</p></div>
    <div class="loginform">
      <h2 style="margin:0 0 4px;font-size:20px;">Bem-vindo</h2>
      <p class="muted" style="margin:0 0 18px;">Protótipo — escolha como deseja entrar.</p>
      <div class="card"><h2>Admin / Financeiro</h2>
        <p class="small">Acesso total: obras, clientes, caixa e pagamentos de todos.</p>
        <button class="btn" id="loginAdmin">Entrar como Admin</button></div>
      <div class="card"><h2>Colaborador</h2>
        <select id="selColab" style="width:100%;margin-bottom:8px;">${opts}</select>
        <button class="btn secondary" id="loginColab">Entrar como Colaborador</button>
        <p class="small">Vê apenas os próprios pagamentos.</p></div>
    </div></div>`;
}
function attachLogin(){
  if(SB.on){
    const f=document.getElementById('loginForm');
    f.onsubmit=async e=>{
      e.preventDefault();
      const b=document.getElementById('lgBtn'), m=document.getElementById('lgMsg');
      b.disabled=true; b.textContent='Entrando…'; m.textContent='';
      SB.manter=document.getElementById('lgManter').checked;
      try{ await sbEntrar(document.getElementById('lgEmail').value.trim().toLowerCase(), document.getElementById('lgSenha').value); }
      catch(err){ m.textContent=err.message; b.disabled=false; b.textContent='Entrar'; }
    };
    return;
  }
  document.getElementById('loginAdmin').onclick=()=>{SESSION={role:'admin'};render();};
  document.getElementById('loginColab').onclick=()=>{const id=document.getElementById('selColab').value;SESSION={role:'colab',userId:id};render();};
}

function mainView(){

  const admin=SESSION.role==='admin';
  const nPend=aprovacoesPendentes().length;
  const tabBtn=(k,l)=>`<button data-tab="${k}" class="${TAB===k?'active':''}">${ico(k)}<span>${l}</span>${k==='aprovacoes'&&nPend?`<em class="badgeN">${nPend}</em>`:''}</button>`;

    </nav>`:'';
  let body='';
  if(admin){
    if(TAB==='dashboard') body=dashboardView();
    else if(TAB==='aprovacoes') body=aprovacoesView();
    else if(TAB==='obras') body=obrasView();

    else if(TAB==='incc') body=inccView();
    else if(TAB==='contas') body=contasView();
    else if(TAB==='fixas') body=fixasView();
    else if(TAB==='caixa') body=caixaView();
    else body=colaboradoresView();
  } else body=colabPagamentosView();
  const adminTools = admin ? `<div class="row"><button id="bkExport" title="Baixar uma cópia de segurança dos dados">Backup</button><button id="bkImportBtn" title="Restaurar dados de um arquivo de backup">Importar</button></div><input type="file" id="bkImport" accept=".json,application/json" style="display:none;">` : '';
  let banner='';
  if(admin){ try{ if(localStorage.getItem(PRE_KEY)) banner=`<div class="card" style="border-color:var(--bad);">
      <h2>⚠️ Este navegador tinha dados diferentes dos da nuvem</h2>
      <p class="small">A nuvem já tinha dados e eles foram carregados aqui. Os dados que estavam só neste navegador foram guardados à parte. Se eram os corretos, envie-os para a nuvem (isso substitui o que está lá).</p>
      <button class="btn" id="enviarLocal">Enviar os dados deste navegador para a nuvem</button> <button class="btn secondary" id="descartarLocal">Descartar, manter os da nuvem</button>
    </div>`; }catch(e){} }
  const info=admin?(TAB_INFO[TAB]||TAB_INFO.colaboradores):['Meus pagamentos','Etapas, aprovações e valores a receber'];
  const foot=`<div class="side-foot"><div class="user">${esc(nome||'')}</div><span id="syncChip">${SYNC_LABEL[SYNC.state]||''}</span>${adminTools}${SB.on?'<button id="alterarSenha">Alterar senha</button>':''}<button id="logout">Sair</button></div>`;
  const side=`<aside class="side"><div class="brand"><img src="${LOGO_ET}" alt="ET Engenharia e Projetos"><span>Financeiro · gestão de obras e caixa</span></div>${tabsHtml}${foot}</aside>`;
  const head=`<div class="pagehead"><div><h1>${info[0]}</h1><div class="sub">${info[1]}</div></div>${admin?'':`<div class="who"><span id="syncChip">${SYNC_LABEL[SYNC.state]||''}</span> ${esc(nome||'')} ${SB.on?'<button id="alterarSenha">Alterar senha</button>':''}<button id="logout">Sair</button></div>`}</div>`;

}
function resolverBaixa(k,a,b,c){
  if(k==='etapa'){ const o=DATA.obras.find(x=>x.id===a); const it=o&&(o.etapasPagamento||[])[b]; return it?{item:it,obra:o}:null; }
  if(k==='equipe'){ const o=DATA.obras.find(x=>x.id===a); const m=o&&(o.equipe||[])[b]; const it=m&&(m.etapas||[])[c]; return it?{item:it,obra:o,m}:null; }
  if(k==='fixa'){ const f=(DATA.despesasFixas||[]).find(x=>x.id===a); return f?{item:fixaMesObj(f,b),fixa:f,ym:b}:null; }
  if(k==='despobra'){ const o=DATA.obras.find(x=>x.id===a); const it=o&&(o.despesasObra||[]).find(x=>x.id===b); return it?{item:it,obra:o}:null; }
  if(k==='conta'){ const it=(DATA.contas||[]).find(x=>x.id===a); return it?{item:it}:null; }
  return null;
}
function attachBaixas(){
  document.querySelectorAll('.dateBr').forEach(i=>i.oninput=()=>maskDateBr(i));
  document.querySelectorAll('.bxAdd').forEach(btn=>btn.onclick=()=>{
    const k=btn.dataset.k, r=resolverBaixa(k,btn.dataset.a,btn.dataset.b,btn.dataset.c); if(!r) return;
    const box=btn.closest('.bxbox');
    const iso=brToIso(box.querySelector('.bxData').value);
    if(!iso){ box.querySelector('.bxData').style.borderColor='var(--bad)'; return; }
    let valor=parseBRL(box.querySelector('.bxVal').value);
    let saldo, base;
    if(k==='etapa'){
      const v=valorEtapaContrato(r.obra,r.item); saldo=v-baixaTotal(r.item);
      base={tipo:'entrada',desc:'Recebimento — '+r.obra.nomeObra+' — '+r.item.nome+(r.item.nfNumero?' (NF '+r.item.nfNumero+')':''),obraId:r.obra.id,origem:{tipo:'etapa',obraId:r.obra.id,refId:r.item.id}};
    } else if(k==='equipe'){
      const v=valorEquipeEtapa(r.obra,r.m,r.item); if(!r.item.aprovado) return;
      if(!temValor(r.item.valorFixo)) r.item.valorFixo=v;
      saldo=v-baixaTotal(r.item);
      base={tipo:'saida',desc:'Pagamento — '+colabNome(r.m.colaboradorId)+' — '+r.obra.nomeObra+' — '+(r.m.papel||'Equipe')+' / '+r.item.nome,obraId:r.obra.id,colaboradorId:r.m.colaboradorId,origem:{tipo:'equipe',obraId:r.obra.id,refId:r.m.id+':'+r.item.nome}};
    } else if(k==='fixa'){
      saldo=fixaValorMes(r.fixa,r.ym)-baixaTotal(r.item); if(!temValor(r.item.valor)) r.item.valor=fixaValorMes(r.fixa,r.ym);
      base={tipo:'saida',desc:'Pagamento — '+r.fixa.nome+' ('+r.ym.slice(5)+'/'+r.ym.slice(0,4)+')',obraId:'',empresaId:r.fixa.empresaId||'',origem:{tipo:'fixa',obraId:'',refId:r.fixa.id+'|'+r.ym}};
    } else if(k==='despobra'){
      saldo=despObraValor(r.obra,r.item)-baixaTotal(r.item);
      base={tipo:'saida',desc:'Pagamento — '+r.obra.nomeObra+' — '+r.item.nome,obraId:r.obra.id,colaboradorId:r.item.colaboradorId||'',origem:{tipo:'despobra',obraId:r.obra.id,refId:r.item.id}};
    } else {
      saldo=(r.item.valor||0)-baixaTotal(r.item);
      base={tipo:'saida',desc:'Pagamento — '+r.item.desc,obraId:r.item.obraId||'',empresaId:r.item.empresaId||'',origem:{tipo:'conta',obraId:r.item.obraId||'',refId:r.item.id}};
    }
    valor=r2(valor); saldo=r2(saldo);
    const campoV=box.querySelector('.bxVal');
    if(!(valor>0)){ campoV.style.borderColor='var(--bad)'; campoV.title='Informe um valor maior que zero.'; return; }
    if(c2(valor)>c2(saldo)){ campoV.style.borderColor='var(--bad)'; campoV.title='O valor é maior que o saldo ('+fmt(saldo)+').'; alert('O valor informado ('+fmt(valor)+') é maior que o saldo em aberto ('+fmt(saldo)+').'); return; }
    if(!lancarBaixa(r.item,{...base,valor,data:iso})) return;
    if(k==='etapa') sincEtapaContrato(r.obra,r.item);
    logAcao((base.tipo==='entrada'?'Recebimento':'Pagamento')+' de '+fmt(valor)+' — '+base.desc.replace(/^(Recebimento|Pagamento) — /,''));
    save(DATA); render();
  });
  document.querySelectorAll('.bxDel').forEach(btn=>btn.onclick=()=>{
    const k=btn.dataset.k, r=resolverBaixa(k,btn.dataset.a,btn.dataset.b,btn.dataset.c); if(!r) return;
    const b=desfazerBaixa(r.item,btn.dataset.bx); if(!b) return;
    logAcao('Estorno de '+fmt(b.valor)+' — motivo: '+_mot.v);
    if(k==='etapa') sincEtapaContrato(r.obra,r.item);
    logAcao('Baixa desfeita de '+fmt(b.valor)+(k==='etapa'?' — '+r.obra.nomeObra+' — '+r.item.nome:''));
    save(DATA); render();
  });
}
function attachSync(){
  const ex=document.getElementById('bkExport');
  if(ex) ex.onclick=async()=>{
    const txt=JSON.stringify(DATA,null,2), fn='financeiro-backup-'+new Date().toISOString().slice(0,10)+'.json';
    try{ const dl=(typeof claude!=='undefined')?await claude.use('downloads'):null; if(dl){ await dl.save({filename:fn,data:txt}); return; } }catch(e){ if(e&&e.code==='declined') return; }
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download=fn; a.click(); }catch(e){}
  };
  const ib=document.getElementById('bkImportBtn'), inp=document.getElementById('bkImport');
  if(ib&&inp){
    ib.onclick=()=>inp.click();
    inp.onchange=async e=>{
      const f=e.target.files[0]; if(!f) return;
      try{
        const d=JSON.parse(await f.text());
        if(!d||!Array.isArray(d.obras)) throw new Error('arquivo inválido');
        d.tiposServico=d.tiposServico||[]; d.colaboradores=d.colaboradores||[]; d.minhasEmpresas=d.minhasEmpresas||[]; d.caixa=d.caixa||[]; d.contas=d.contas||[]; d.historico=d.historico||[]; d.despesasFixas=d.despesasFixas||[]; d.incc=d.incc||[];
        ensureTiposPadrao(d); DATA=d; save(DATA); render();
      }catch(err){ alert('Não foi possível importar: '+err.message); }
    };
  }
  const env=document.getElementById('enviarLocal');
  if(env) env.onclick=()=>{ try{ const d=JSON.parse(localStorage.getItem(PRE_KEY)); ensureTiposPadrao(d); DATA=d; localStorage.removeItem(PRE_KEY); save(DATA); render(); }catch(e){} };
  const desc=document.getElementById('descartarLocal');
  if(desc) desc.onclick=()=>{ try{ localStorage.removeItem(PRE_KEY); }catch(e){} render(); };
}


// ===== Equipe da obra — visão simples (grade colaborador × disciplina) =====
let EQUIPE_MODO='grade', GRID_EXTRA={}, GRID_ABERTO={};
function equipeGridModelo(obra){
  const eq=obra.equipe||[];
  const bases=[{id:'',nome:'Geral'}].concat((obra.servicos||[]).map(sv=>({id:sv.id,nome:tipoNome(sv.tipoId)})));
  const baseOk=new Set(bases.map(b=>b.id));
  const cel={}, colabs=[], legado=[];
  eq.forEach((m,mi)=>{
    const b=(m.baseIds||[]); const base=b.length===0?'':(b.length===1?b[0]:null);
    const k=m.colaboradorId+'|'+base;
    if(!m.colaboradorId||base===null||!baseOk.has(base)||m.inativo||cel[k]!==undefined){ legado.push(mi); return; }
    cel[k]=mi; if(!colabs.includes(m.colaboradorId)) colabs.push(m.colaboradorId);
  });
  (GRID_EXTRA[obra.id]||[]).forEach(c=>{ if(!colabs.includes(c)) colabs.push(c); });
  return {bases,cel,colabs,legado};
}
function equipeGridHtml(obra,arr){

  const somaCol={}; M.bases.forEach(b=>somaCol[b.id]={pct:0,val:0});
  const linhas=M.colabs.map(c=>{
    const membros=M.bases.map(b=>M.cel[c+'|'+b.id]).filter(x=>x!==undefined);
    const todos=eq.map((m,mi)=>m.colaboradorId===c?mi:-1).filter(x=>x>=0);
    const papel=(eq[todos[0]]||{}).papel||colabCargo(c)||'';
    let totalVal=0;
    const cels=M.bases.map(b=>{
      const mi=M.cel[c+'|'+b.id]; const m=mi!==undefined?eq[mi]:null;
      const v=m?equipeMembroValor(obra,m):0; totalVal+=v;
      if(m){ somaCol[b.id].pct+=(m.pct||0); somaCol[b.id].val+=v; }
      return `<td class="num"><input type="number" step="0.1" min="0" class="pct-input gcell" data-o="${oid}" data-c="${esc(c)}" data-b="${esc(b.id)}" value="${m&&m.pct?m.pct:''}" placeholder="—">${m&&m.pct?`<div class="small">${fmt(v)}</div>`:''}</td>`;
    }).join('');
    const hist=todos.some(mi=>equipeTemHistorico(eq[mi]));
    const aberto=!!GRID_ABERTO[obra.id+'|'+c];
    const det=aberto?`<tr><td colspan="${M.bases.length+3}">${mediaPainelHtml(obra,c,todos)}${todos.map(mi=>arr[mi]).join('')}</td></tr>`:'';
    return `<tr>
      <td><b>${esc(colabNome(c))}</b>${todos.some(mi=>eq[mi].modelo==='media')?'<div class="small">pgto: média mensal</div>':''}</td>
      <td><input type="text" class="gcargo" list="papeisEquipe" data-o="${oid}" data-c="${esc(c)}" value="${esc(papel)}" style="width:105px;"></td>
      ${cels}
      <td class="num"><b>${fmt(totalVal)}</b></td>
      <td style="white-space:nowrap;"><input type="number" step="0.1" min="0" class="pct-input gall" data-c="${esc(c)}" placeholder="%" style="width:54px;" title="Mesmo % em todas as disciplinas"><button class="btn secondary gallbtn" data-o="${oid}" data-c="${esc(c)}" title="Aplicar esse % em todas as disciplinas">todas</button>
        <button class="btn secondary gdet" data-o="${oid}" data-c="${esc(c)}">${aberto?'Ocultar':'Etapas'}</button>
        ${hist?`<button class="btn secondary gina" data-o="${oid}" data-c="${esc(c)}" title="Tem pagamentos; não pode ser removido">Inativar</button>`:`<button class="btn danger gdel" data-o="${oid}" data-c="${esc(c)}">x</button>`}</td>
    </tr>${det}`;
  }).join('');
  const rodape=`<tr style="font-weight:600;"><td colspan="2">Total distribuído</td>${M.bases.map(b=>{ const t=somaCol[b.id]; return `<td class="num ${t.pct>100.0001?'neg':''}">${t.pct?pct(t.pct):'—'}<div class="small">${t.val?fmt(t.val):''}</div></td>`; }).join('')}<td class="num">${fmt(M.bases.reduce((a,b)=>a+somaCol[b.id].val,0))}</td><td></td></tr>`;
  const livres=DATA.colaboradores.filter(u=>!M.colabs.includes(u.id));
  const add=`<div class="row-flex" style="margin-top:8px;gap:6px;"><select class="gaddsel" data-o="${oid}">${livres.map(u=>`<option value="${esc(u.id)}">${esc(u.nome)}</option>`).join('')||'<option value="">(todos já estão na obra)</option>'}</select><button class="btn secondary gadd" data-o="${oid}">+ colaborador</button></div>`;

  return topo+`<p class="small">Digite o % de cada colaborador sobre o líquido de cada disciplina (vazio = não participa). "Geral" = % sobre o líquido total da obra. Mudar um % recalcula tudo; as etapas de pagamento (30/30/30/10) continuam as mesmas.</p>

}

// ===== Pagamento por média mensal (período + retenção final) =====
const MES_ABREV=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function mediaPadrao(){ return {inicio:hojeISO().slice(0,7),meses:6,ret:10,dia:5}; }
function mediaEtapas(cfg){
  const n=Math.max(1,Math.min(36,Math.round(+cfg.meses)||6)), ret=Math.max(0,Math.min(50,+cfg.ret||0)), dia=Math.max(1,Math.min(28,Math.round(+cfg.dia)||5));
  const base=Math.round((100-ret)/n*1e4)/1e4; const et=[]; let acum=0;
  for(let i=0;i<n;i++){
    const ym=mesDeslocar(cfg.inicio,i), [y,m]=ym.split('-').map(Number);
    const pc=i===n-1? Math.round((100-ret-acum)*1e4)/1e4 : base; acum+=pc;
    et.push({nome:'Parcela '+(i+1)+'/'+n+' — '+MES_ABREV[m-1]+'/'+y,pct:pc,mensal:true,pagarEm:ym+'-'+String(dia).padStart(2,'0'),concluido:false,data:'',aprovado:false,baixas:[]});
  }
  if(ret>0) et.push({nome:'Retenção para ajustes ('+ret+'%)',pct:ret,retencao:true,concluido:false,data:'',aprovado:false,baixas:[]});
  return et;
}
// Retenção da média: fica disponível para aprovação quando a obra é concluída (ou faturada); se a obra reabrir, volta a reter.
function sincRetencoes(obra){
  const fim=obra.status==='concluida'||obra.status==='faturada';
  (obra.equipe||[]).forEach(m=>(m.etapas||[]).forEach(e=>{
    if(!e.retencao||e.aprovado) return;
    if(fim){ e.concluido=true; if(!e.data) e.data=hojeISO(); } else { e.concluido=false; e.data=''; }
  }));
}
function membroTemMovimento(m){ return (m.etapas||[]).some(e=>(e.baixas||[]).length>0||e.aprovado); }
// modo: 'media' | 'entrega'; obraId vazio = todas as obras do colaborador. Não mexe em quem já tem aprovação/pagamento.
function aplicarModeloPagamento(colabId,modo,cfg,obraId){
  let ok=0,bloq=0;
  DATA.obras.forEach(o=>{
    if(obraId && o.id!==obraId) return;
    (o.equipe||[]).forEach(m=>{
      if(m.colaboradorId!==colabId || m.inativo) return;
      if(membroTemMovimento(m)){ bloq++; return; }
      if(modo==='media'){ m.modelo='media'; m.media={inicio:cfg.inicio,meses:+cfg.meses,ret:+cfg.ret,dia:+cfg.dia}; m.etapas=mediaEtapas(cfg); }
      else { delete m.modelo; delete m.media; m.etapas=etapasCoordPadrao(); }
      ok++;
    });
    sincRetencoes(o);
  });
  return {ok,bloq};
}
function mediaPainelHtml(obra,c,idxs){
  const eq=obra.equipe||[];
  const comMedia=idxs.map(i=>eq[i]).find(m=>m.media);

  const resumo=tot>0?`<p class="small">Colaborador no modelo média (todas as obras): total <b>${fmt(tot)}</b> · parcela mensal <b>${fmt(tot*(100-cfg.ret)/100/cfg.meses)}</b> · retido para ajustes <b>${fmt(tot*cfg.ret/100)}</b></p>`:'';
  const oid=esc(obra.id), cc=esc(c);
  return `<div class="servbox" style="background:var(--accent-bg);">
    <b>Forma de pagamento de ${esc(colabNome(c))}</b>
    <div class="row-flex" style="flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center;">
      <select class="gm-modo"><option value="entrega" ${modo==='entrega'?'selected':''}>Por entrega (30/30/30/10)</option><option value="media" ${modo==='media'?'selected':''}>Média mensal</option></select>
      <label class="small">início <input type="month" class="gm-ini" value="${esc(cfg.inicio)}"></label>
      <label class="small">meses <input type="number" min="1" max="36" class="pct-input gm-meses" value="${cfg.meses}"></label>
      <label class="small">retenção % <input type="number" min="0" max="50" step="1" class="pct-input gm-ret" value="${cfg.ret}"></label>
      <label class="small">dia do pagamento <input type="number" min="1" max="28" class="pct-input gm-dia" value="${cfg.dia}"></label>
    </div>
    <div class="row-flex" style="gap:8px;margin-top:6px;"><button class="btn gmaplicar" data-o="${oid}" data-c="${cc}" data-esc="obra">Aplicar nesta obra</button><button class="btn secondary gmaplicar" data-o="${oid}" data-c="${cc}" data-esc="todas">Aplicar em todas as obras dele(a)</button></div>
    <p class="small">No modo média, o total que ele(a) vai receber em cada obra é dividido em parcelas mensais (aparecem em Aprovações a partir do mês de cada uma) e a retenção (saldo final) fica guardada até a obra ser marcada como Concluída — aí ela aparece em Aprovações para o ajuste final. Também dá para liberar antes pelo botão abaixo. Quem já tem aprovação ou pagamento não é alterado.</p>
    ${resumo}
    ${idxs.map(i=>eq[i]).filter(m=>m.etapas&&m.etapas.some(e=>e.retencao&&!e.aprovado)).map(m=>`<button class="btn secondary gmliberar" data-o="${oid}" data-id="${esc(m.id)}">Liberar retenção (${esc(m.papel||'')} ${pct(m.etapas.find(e=>e.retencao).pct)})</button>`).join(' ')}
  </div>`;
}
function equipeGridSet(obraId,colab,base,pct){
  const obra=DATA.obras.find(o=>o.id===obraId); if(!obra) return;
  obra.equipe=obra.equipe||[];
  const M=equipeGridModelo(obra); const mi=M.cel[colab+'|'+base];
  pct=Math.max(0,Math.round((parseFloat(pct)||0)*1e4)/1e4);
  if(mi!==undefined){
    const m=obra.equipe[mi];
    if(pct>0) m.pct=pct;
    else if(equipeTemHistorico(m)) m.pct=0;
    else obra.equipe.splice(mi,1);
  } else if(pct>0){
    const outro=obra.equipe.find(m=>m.colaboradorId===colab);
    const novo={id:novoId('eq'),colaboradorId:colab,papel:(outro&&outro.papel)||colabCargo(colab)||'',pct,baseIds:base?[base]:[],etapas:etapasCoordPadrao()};
    let ref=null; DATA.obras.forEach(o=>(o.equipe||[]).forEach(m=>{ if(!ref&&m.colaboradorId===colab&&m.modelo==='media'&&m.media) ref=m.media; }));
    if(ref){ novo.modelo='media'; novo.media={...ref}; novo.etapas=mediaEtapas(ref); }
    obra.equipe.push(novo);
  }
}

// ===== Serviços e despesas da obra — visão simples (grades) + resumo por colaborador/despesa =====

    <tr style="font-weight:600;"><td>Total</td><td class="num">${fmt(totBruto)}</td><td class="num">${fmt(totImp)}</td><td class="num">${fmt(totLiq)}</td><td></td></tr></table></div>

  // grade de despesas (linhas = nome da despesa, colunas = disciplinas)

  const colTot={}; sv.forEach(s=>colTot[s.id]={pct:0,val:0});
  const rowsB=nomes.map(n=>{
    let tot=0;
    const cels=sv.map(s=>{
      const d=(s.despesas||[]).find(x=>x.nome===n); const v=d?calcServico(s).liquido*((d.pct||0)/100):0; tot+=v;
      if(d){ colTot[s.id].pct+=(d.pct||0); colTot[s.id].val+=v; }

function servSetDespesa(obra,sid,nome,pct){
  const s=(obra.servicos||[]).find(x=>x.id===sid); if(!s) return; s.despesas=s.despesas||[];

  else if(i>=0) s.despesas.splice(i,1);
}
// Resumo da obra: linhas = colaboradores e despesas; colunas = disciplinas (+ Geral e Total)
function resumoGridObra(obra){
  const sv=obra.servicos||[]; const cols=sv.map(s=>({id:s.id,nome:tipoNome(s.tipoId)})); const geral='__geral';
  const todasCols=cols.concat([{id:geral,nome:'Geral'}]);
  const linhasEq={}, ordemEq=[];
  (obra.equipe||[]).forEach(m=>{
    const v=equipeMembroValor(obra,m); if(!v) return;
    const k=m.colaboradorId||'?'; if(!linhasEq[k]){ linhasEq[k]={nome:colabNome(m.colaboradorId)||'(sem colaborador)',papel:m.papel||'',v:{}}; ordemEq.push(k); }
    const ids=(m.baseIds||[]).filter(id=>sv.some(s=>s.id===id));
    if(!ids.length){ linhasEq[k].v[geral]=(linhasEq[k].v[geral]||0)+v; }
    else { const pesos=ids.map(id=>{const s=sv.find(x=>x.id===id); return calcServico(s).liquido;}); const sp=pesos.reduce((a,b)=>a+b,0)||1; ids.forEach((id,i)=>{ linhasEq[k].v[id]=(linhasEq[k].v[id]||0)+v*pesos[i]/sp; }); }
  });
  const linhasDesp={}, ordemD=[];
  sv.forEach(s=>(s.despesas||[]).forEach(d=>{ const v=calcServico(s).liquido*((d.pct||0)/100); if(!v) return; const k=d.nome||'Outros'; if(!linhasDesp[k]){ linhasDesp[k]={nome:k,v:{}}; ordemD.push(k); } linhasDesp[k].v[s.id]=(linhasDesp[k].v[s.id]||0)+v; }));
  const linhasObra=[]; (obra.despesasObra||[]).forEach(d=>{ const v=despObraValor(obra,d); if(v) linhasObra.push({nome:d.nome||'Despesa da obra',v:{[geral]:v}}); });
  const tot={}; todasCols.forEach(c=>tot[c.id]=0);

function indicadoresFinanceiros(){
  const hoje=hojeISO(), mes=hoje.slice(0,7);
  let entradas=0, saidas=0, recebidoMes=0, pagoMes=0;
  DATA.caixa.filter(movVisivel).forEach(m=>{
    const k=m.estornoDe?-1:1;   // estorno abate da mesma categoria que corrige (não aparece como receita/despesa nova)
    if((m.tipo==='entrada')===!m.estornoDe){ entradas+=k*m.valor; if((m.data||'').startsWith(mes)) recebidoMes+=k*m.valor; }
    else { saidas+=k*m.valor; if((m.data||'').startsWith(mes)) pagoMes+=k*m.valor; }
  });
  let aReceber=0, aFaturar=0, vencidoReceber=0;
  const entradasPrev={}; // mes -> valor (saldo de etapas por vencimento)
  obrasVisiveis().forEach(o=>{
    resumoEtapasObra(o).forEach(e=>{
      if(e.saldo<=0.005) return;
      if(e.nfNumero) aReceber+=e.saldo; else aFaturar+=e.saldo;
      if(e.vencimento && e.vencimento<hoje) vencidoReceber+=e.saldo;
      if(e.nfNumero||e.vencimento){ const k=e.vencimento? e.vencimento.slice(0,7):'sem'; entradasPrev[k]=(entradasPrev[k]||0)+e.saldo; }
    });
  });
  let aPagarContas=0, vencidoPagar=0; const saidasPrev={};
  (DATA.contas||[]).filter(contaVisivel).forEach(c=>{
    const sal=Math.max(0,(c.valor||0)-baixaTotal(c)); if(sal<=0.005) return;
    aPagarContas+=sal; if(c.vencimento && c.vencimento<hoje) vencidoPagar+=sal;
    const k=c.vencimento? c.vencimento.slice(0,7):'sem'; saidasPrev[k]=(saidasPrev[k]||0)+sal;
  });
  fixaItens(mesDeslocar(mes,-6),mesDeslocar(mes,5)).forEach(x=>{
    const sal=Math.max(0,x.valor-x.pago); if(sal<=0.005) return;
    if(x.ym<=mes){ aPagarContas+=sal; if(x.venc<hoje) vencidoPagar+=sal; }
    saidasPrev[x.ym]=(saidasPrev[x.ym]||0)+sal;
  });
  obrasVisiveis().forEach(o=>(o.despesasObra||[]).forEach(d=>{
    const sal=Math.max(0,despObraValor(o,d)-baixaTotal(d)); if(sal<=0.005) return;
    aPagarContas+=sal; if(d.vencimento && d.vencimento<hoje) vencidoPagar+=sal;
    const k=d.vencimento? d.vencimento.slice(0,7):'sem'; saidasPrev[k]=(saidasPrev[k]||0)+sal;
  }));
  const eq=equipeAPagarTotal();
  obrasVisiveis().forEach(o=>(o.equipe||[]).forEach(m=>(m.etapas||[]).forEach(e=>{
    if(!e.pct||!e.aprovado) return;
    const sal=Math.max(0,valorEquipeEtapa(o,m,e)-baixaTotal(e)); if(sal<=0.005) return;
    const k=e.pagarEm? e.pagarEm.slice(0,7):'sem'; saidasPrev[k]=(saidasPrev[k]||0)+sal;
  })));
  const aPagar=aPagarContas+eq.saldo;
  const saldoCaixa=entradas-saidas;
  return {mes,entradas,saidas,recebidoMes,pagoMes,aReceber,aFaturar,vencidoReceber,aPagarContas,vencidoPagar,aPagar,eq,saldoCaixa,saldoProjetado:saldoCaixa+aReceber-aPagar,entradasPrev,saidasPrev};
}
function fluxoProjetadoCard(ind){

  for(let i=0;i<6;i++){ meses.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} }
  const linhas=[]; let acum=ind.saldoCaixa;
  const atrasE=Object.keys(ind.entradasPrev).filter(k=>k!=='sem'&&k<mesAtual).reduce((s,k)=>s+ind.entradasPrev[k],0);
  const atrasS=Object.keys(ind.saidasPrev).filter(k=>k!=='sem'&&k<mesAtual).reduce((s,k)=>s+ind.saidasPrev[k],0);
  const push=(label,e,sd)=>{ acum+=e-sd; linhas.push({label,e,sd,acum}); };

  return `<div class="card"><h2>Fluxo de caixa projetado</h2>

    </table></div></div>`;

  });
  return lista;
}

function etapasBox(obra,r){
  const etapas=obra.etapasPagamento||[];
  const somaPct=etapas.reduce((s,e)=>s+(e.pct||0),0);
  const rows=etapas.map((e,i)=>{
    const valor=valorEtapaContrato(obra,e), rec=baixaTotal(e);
    const sit = e.pago ? '<span class="badge badge-faturada">Recebido</span>' : (rec>0.005 ? '<span class="badge badge-concluida">Parcial</span>' : '<span class="small">—</span>');
    return `<tr>
      <td><input type="text" class="etapaNome" data-o="${esc(obra.id)}" data-i="${i}" value="${esc(e.nome)}"></td>
      <td class="num">${e.aditivoId?'<span class="small">aditivo</span>':`<input type="number" step="0.1" class="pct-input etapaPct" data-o="${esc(obra.id)}" data-i="${i}" value="${e.pct}">%`}</td>
      <td class="num">${fmt(valor)}${temValor(e.valorFixo)?' <span title="Valor congelado: já há NF emitida ou recebimento">🔒</span>':''}</td>
      <td style="text-align:center;">${sit}</td>
      <td class="num small">${fmt(rec)}</td>
      <td><button class="btn danger deletapa" data-o="${esc(obra.id)}" data-i="${i}" ${(e.baixas||[]).length||e.aditivoId?`disabled title="${e.aditivoId?'Exclua pelo aditivo, na disciplina':'Desfaça os recebimentos antes de excluir'}"`:''}>x</button></td>
    </tr>`;
  }).join('');
  const recebido = etapas.reduce((s,e)=> s + baixaTotal(e),0);
  return `<table>
    <tr><th>Etapa</th><th class="num">%</th><th class="num">Valor</th><th style="text-align:center;">Situação</th><th class="num">Recebido</th><th></th></tr>
    ${rows || '<tr><td colspan="6" class="small">Nenhuma etapa cadastrada.</td></tr>'}
    <tr class="hdr"><td>Total</td><td class="num">${pct(somaPct)}${Math.round(somaPct)!==100?' ⚠️':''}</td><td class="num">${fmt(r.valorTotal)}</td><td colspan="3" class="num">Recebido: ${fmt(recebido)} · registre NF e recebimentos em “Resumo p/ Cobrança”</td></tr>
  </table>
  ${Math.round(somaPct)!==100?'<p class="small" style="color:var(--bad);">A soma das etapas está diferente de 100% do valor da obra.</p>':''}
  ${conferirObra(obra).map(m=>`<p class="small" style="color:var(--bad);">⚠️ ${esc(m)}</p>`).join('')}
  <button class="btn secondary addetapa" data-o="${esc(obra.id)}">+ etapa</button>`;
}

function baixaWidget(kind,a,b,c,saldo,baixas,label){
  const ref=`data-k="${esc(kind)}" data-a="${esc(a)}" data-b="${esc(b)}" data-c="${esc(c)}"`;
  const lista=(baixas||[]).map(x=>`<div class="small" style="white-space:nowrap;">${x.data?isoToBr(x.data):'s/ data'} · ${fmt(x.valor)}${x.semCaixa?' <span title="Registrado antes da integração com o caixa">(sem caixa)</span>':''} <button class="btn danger bxDel" ${ref} data-bx="${esc(x.id)}" style="padding:0 5px;" title="Desfazer esta baixa e o lançamento no caixa">x</button></div>`).join('');
  const form = saldo>0.005 ? `<div class="row-flex bxbox" style="gap:4px;flex-wrap:nowrap;margin-top:4px;">
      <input type="text" inputmode="decimal" class="bxVal" value="${saldo.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}" style="width:92px;" title="Valor">
      <input type="text" inputmode="numeric" class="bxData dateBr" value="${isoToBr(hojeISO())}" maxlength="10" style="width:92px;" title="Data (dd/mm/aaaa)">
      <button class="btn secondary bxAdd" ${ref}>${label||'Baixar'}</button></div>` : '';
  return lista+form;
}

function resumoView(){
  const resumosPorObra=obrasVisiveis().map(obra=>({obra, etapas:resumoEtapasObra(obra), valorTotalObra:calcObra(obra).valorTotal}));
  const prontas=[];
  resumosPorObra.forEach(({obra,etapas,valorTotalObra})=>{
    etapas.filter(e=>e.status==='pronto' && !e.pago).forEach(e=> prontas.push({obra,etapa:e,valorTotalObra}));
  });

  const prontasHtml = prontas.length ? `<div class="card" style="border-color:var(--accent);">
    <h2>✅ Etapas prontas para cobrar do cliente (${prontas.length})</h2>
    <p class="small">Todos os colaboradores vinculados a esta etapa já concluíram e o responsável aprovou a entrega — o financeiro já pode solicitar a NF ao cliente. Registre a NF, o vencimento e os recebimentos na tabela de cada obra, logo abaixo.</p>
    <table><tr><th>Obra</th><th>Etapa do contrato</th><th class="num">%</th><th class="num">Valor</th></tr>
    ${prontas.map(({obra,etapa})=>`<tr><td>${esc(obra.nomeObra)}</td><td>${esc(etapa.nome)}</td><td class="num">${etapa.aditivoId?'aditivo':pct(etapa.pct)}</td><td class="num">${fmt(etapa.valor)}</td></tr>`).join('')}
    </table>
  </div>` : `<div class="card"><p class="small">Nenhuma etapa pronta para cobrança no momento — assim que todos os colaboradores vinculados a uma etapa concluírem e a entrega for aprovada, ela aparece aqui.</p></div>`;

  const STATUS_LABEL_RESUMO={pronto:'Pronto para cobrar',parcial:'Em andamento',pendente:'Pendente',sem_entrega:'—'};
  const STATUS_BADGE_RESUMO={pronto:'faturada',parcial:'concluida',pendente:'andamento'};
  const hoje=hojeISO();
  const obrasHtml=resumosPorObra.map(({obra,etapas})=>{
    let totValor=0, totRec=0;
    const rows=etapas.map(e=>{
      totValor+=e.valor; totRec+=Math.min(e.recebido,e.valor);
      const situacao = e.status==='sem_entrega'
        ? '<span class="small">—</span>'
        : `<span class="badge badge-${STATUS_BADGE_RESUMO[e.status]}">${STATUS_LABEL_RESUMO[e.status]}${e.status==='parcial'?' ('+e.concluidos+'/'+e.totalDeliv+')':''}</span>`;
      const vencido = !!(e.vencimento && !e.pago && e.vencimento < hoje);

  return prontasHtml + obrasHtml;
}

const FIXA_CATS=['Aluguel','Contabilidade','Imposto / taxa fixa','Outras fixas'];
function diasNoMes(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function fixaVenc(f,ym){ return ym+'-'+String(Math.min(Math.max(f.dia||1,1),diasNoMes(ym))).padStart(2,'0'); }
function fixaValorMes(f,ym){ const m=(f.meses||{})[ym]; return m&&temValor(m.valor)?m.valor:(f.valor||0); }
function fixaMesObj(f,ym){ f.meses=f.meses||{}; f.meses[ym]=f.meses[ym]||{baixas:[]}; if(!Array.isArray(f.meses[ym].baixas)) f.meses[ym].baixas=[]; return f.meses[ym]; }
function fixaAtivaEm(f,ym){ const mo=(f.meses||{})[ym]; if(mo&&(mo.baixas||[]).length) return true; if(f.ativa===false) return false; if(f.inicio&&ym<f.inicio) return false; if(f.fim&&ym>f.fim) return false; return true; }
function mesesEntre(a,b){ const r=[]; let m=a, g=0; while(m<=b&&g++<60){ r.push(m); m=mesDeslocar(m,1); } return r; }
function fixaItens(de,ate){
  const out=[];
  (DATA.despesasFixas||[]).filter(f=>empresaPassa(f.empresaId||'')).forEach(f=>{
    mesesEntre(de,ate).forEach(ym=>{
      if(!fixaAtivaEm(f,ym)) return;
      const mo=(f.meses||{})[ym]||{}; const valor=fixaValorMes(f,ym), pago=baixaTotal(mo), hoje=hojeISO(), venc=fixaVenc(f,ym), paga=valor>0&&pago>=valor-0.005;
      out.push({f,ym,valor,pago,venc,baixas:mo.baixas||[],sit:paga?'paga':(venc<hoje?'vencida':(pago>0.005?'parcial':'aberta'))});
    });
  });
  return out;
}

function conferirObra(obra){
  const av=[], et=obra.etapasPagamento||[];
  et.forEach(e=>{ if((+e.pct||0)<0) av.push('Etapa "'+e.nome+'" com percentual negativo.'); });
  const somaEq={}; (obra.equipe||[]).forEach(m=>{ if((+m.pct||0)<0) av.push('Integrante com percentual negativo.'); });
  const totalEq=(obra.equipe||[]).reduce((a,m)=>a+(+m.pct||0),0);
  if(totalEq>100.001) av.push('A soma dos percentuais da equipe ('+totalEq.toFixed(1)+'%) passa de 100% do valor líquido.');
  (obra.equipe||[]).forEach(m=>{ const t=(m.etapas||[]).reduce((a,e)=>a+(+e.pct||0),0); if((m.etapas||[]).length && Math.abs(t-100)>0.01) av.push('Etapas de '+colabNome(m.colaboradorId)+' somam '+t.toFixed(1)+'% (deveriam somar 100%).'); });
  (obra.servicos||[]).forEach(sv=>(sv.aditivos||[]).forEach(a=>{
    const e=et.find(x=>x.aditivoId===a.id);
    if(!e) av.push('Aditivo "'+a.desc+'" não gerou a cobrança correspondente.');
    else if(c2(e.valorFixo)!==c2(a.valor)) av.push('Cobrança do aditivo "'+a.desc+'" ('+fmt(e.valorFixo)+') difere do valor do aditivo ('+fmt(a.valor)+').');
  }));
  et.filter(e=>e.aditivoId).forEach(e=>{ if(!(obra.servicos||[]).some(sv=>(sv.aditivos||[]).some(a=>a.id===e.aditivoId))) av.push('Cobrança "'+e.nome+'" aponta para um aditivo que não existe mais.'); });
  et.forEach(e=>{ const v=valorEtapaContrato(obra,e), rec=baixaTotal(e); if(c2(rec)>c2(v)) av.push('Etapa "'+e.nome+'": recebido ('+fmt(rec)+') maior que o valor cobrado ('+fmt(v)+').'); });
  return av;
}

function mesNomeCompleto(ym){ const [y,m]=ym.split('-'); const n=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][parseInt(m,10)-1]; return n.charAt(0).toUpperCase()+n.slice(1)+' de '+y; }
function mesDeslocar(ym,delta){ let [y,m]=ym.split('-').map(Number); m+=delta; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+String(m).padStart(2,'0'); }

    itens.push({kind:'conta',id:c.id,venc:c.vencimento||'',desc:c.desc,cat:c.categoria||'',local:DATA.obras.find(o=>o.id===c.obraId)?.nomeObra||(c.empresaId?empresaNome(c.empresaId):'—'),valor:c.valor||0,pago,sit:contaSituacao(c),baixas:c.baixas||[],ref:['conta',c.id,'','']});
  });
  obrasVisiveis().forEach(o=>(o.despesasObra||[]).forEach(d=>{

    const venc=d.vencimento||'', paga=val>0&&pago>=val-0.005;
    itens.push({kind:'despobra',o:o.id,d:d.id,id:o.id+'|'+d.id,venc,desc:d.nome,cat:(d.fornecedor||d.categoria||'Despesa da obra')+(d.colaboradorId?' · '+colabNome(d.colaboradorId):''),local:o.nomeObra,valor:val,pago,

    itens.push({kind:'equipe',o:o.id,mi,ei,id:o.id+'|'+mi+'|'+ei,venc,semData:!venc,desc:'Equipe — '+colabNome(m.colaboradorId)+' — '+(m.papel||'Equipe')+' / '+e.nome,cat:'Equipe',local:o.nomeObra,valor:val,pago,
      sit:paga?'paga':(venc&&venc<hoje?'vencida':(pago>0.005?'parcial':'aberta')),baixas:e.baixas||[],ref:['equipe',o.id,mi,ei]});
  })));
  const saldoDe=i=>Math.max(0,i.valor-i.pago);
  const noMes=i=>{
    if(!mes) return true;
    if(i.venc) return i.venc.slice(0,7)===mes;

  const doMes=itens.filter(noMes), atrasadas=itens.filter(i=>!noMes(i)&&atrasada(i));

    const w=(sd)=>baixaWidget(i.ref[0],i.ref[1],i.ref[2],i.ref[3],sd,i.baixas,'Pagar');

      <td>${i.venc?isoToBr(i.venc):'<span class="small">sem data</span>'}${atras?' <span class="small">(atrasada)</span>':''}</td><td>${esc(i.desc)}</td><td class="small">${esc(i.cat)}</td><td class="small">${esc(i.local)}</td>
      <td class="num">${fmt(i.valor)}</td><td class="num">${i.pago>0?fmt(i.pago)+(sit==='paga'&&ultData?'<div class="small">em '+isoToBr(ultData)+'</div>':''):'—'}</td><td style="text-align:center;">${badge}</td>
      <td style="min-width:200px;">${sit==='paga'?w(0):`<details ${i.pago>0?'open':''}><summary class="small" style="cursor:pointer;">pagar parcial / outra data</summary>${w(saldo)}</details>`}</td>
      <td>${i.kind==='conta'?`<button class="btn danger delconta" data-id="${esc(i.id)}" ${i.baixas.length?'disabled title="Desmarque o pagamento antes de excluir"':''}>x</button>`:''}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="10" class="small">Nenhuma conta ${mes?'com vencimento neste mês':'cadastrada'}. Cadastre em “Nova conta a pagar” abaixo${mes?' ou clique em “Todos” para ver os outros meses':''}.</td></tr>`;
  return `<div class="card">
      <div class="row-flex" style="justify-content:space-between;flex-wrap:wrap;">
        <div class="row-flex">
          <button class="btn secondary mesPrev" ${mes?'':'disabled'}>‹</button>
          <h2 style="margin:0;min-width:190px;text-align:center;">${mes?mesNomeCompleto(mes):'Todos os meses'}</h2>
          <button class="btn secondary mesNext" ${mes?'':'disabled'}>›</button>
          <button class="btn secondary mesHoje">Mês atual</button>

        </div>
      </div>
      <div class="grid3" style="margin:12px 0;">
        <div><span class="small">Total do mês</span><br><b>${fmt(totMes)}</b></div>
        <div><span class="small">Já pago</span><br><b class="pos">${fmt(pagoMes)}</b></div>

    (o.equipe||[]).forEach(m=>(m.etapas||[]).forEach(e=>(e.baixas||[]).forEach(b=>{ if(b.semCaixa&&!b.conferido) out.push({o,b,tipo:'saida',colaboradorId:m.colaboradorId,label:o.nomeObra+' — '+colabNome(m.colaboradorId)+' / '+e.nome,origem:{tipo:'equipe',obraId:o.id,refId:m.id+':'+e.nome}}); })));

}

function mesAnoLabel(data){
  if(!data) return '';
  const [y,m]=data.split('-');
  const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return MESES[parseInt(m,10)-1]+'/'+y;
}
function fichaDe(uid){

function pagamentosDoColaborador(uid,todasAsObras){
  if(SB.on && SESSION.role==='colab'){
    const linhas=((SB.ficha&&SB.ficha.linhas)||[]).map(l=>({...l,empresaId:'',baixas:l.baixas||[]}));
    let total=0,aprovado=0,pago=0; linhas.forEach(l=>{ total+=l.val; if(l.aprovado) aprovado+=l.val; pago+=l.pago; });
    return {total,totalConcluido:aprovado,aprovado,pago,saldo:Math.max(0,aprovado-pago),linhas,eqTotal:total,eqAprovado:aprovado,eqPago:pago};
  }
  let total=0, aprovado=0, pago=0; const linhas=[];
  DATA.obras.forEach(obra=>{
    if(!todasAsObras && SESSION.role==='admin' && !obraVisivel(obra)) return;
    (obra.equipe||[]).forEach((m,mi)=>{
      if(m.colaboradorId!==uid) return;
      (m.etapas||[]).forEach((e,ei)=>{
        if(!e.pct) return;
        const val=valorEquipeEtapa(obra,m,e), pg=baixaTotal(e), sit=equipeSituacao(e,val);
        total+=val; if(e.aprovado) aprovado+=val; pago+=pg;
        linhas.push({obraId:obra.id,empresaId:obra.empresaId||'',obra:obra.nomeObra,equipeIdx:mi,etapaIdx:ei,tipo:'equipe_etapa',papel:(m.papel||'Equipe')+' — '+e.nome,p:e.pct,val,pago:pg,saldo:e.aprovado?Math.max(0,val-pg):0,sit,concluido:eqConcluida(e),aprovado:!!e.aprovado,baixas:e.baixas||[],pagarEm:e.pagarEm||'',data:e.data||'',mesAno:e.aprovado?mesAnoLabel(e.data):''});
      });
    });
  });
  const eqTotal=total, eqAprovado=aprovado, eqPago=pago;
  // despesas da obra vinculadas a este colaborador (lista de materiais, estudo de proteção...) — valor definido pelo admin, já aprovado
  DATA.obras.forEach(obra=>{
    if(!todasAsObras && SESSION.role==='admin' && !obraVisivel(obra)) return;
    (obra.despesasObra||[]).forEach(d=>{
      if(d.colaboradorId!==uid) return;
      const val=despObraValor(obra,d), pg=baixaTotal(d); if(val<=0.004&&pg<=0.004) return;
      const paga=val>0&&pg>=val-0.005, sit=paga?'pago':(pg>0.005?'parcial':'aprovado');
      total+=val; aprovado+=val; pago+=pg;
      linhas.push({obraId:obra.id,empresaId:obra.empresaId||'',obra:obra.nomeObra,equipeIdx:-1,etapaIdx:-1,tipo:'despesa',despId:d.id,papel:d.nome+' (despesa da obra)',p:despObraPct(obra,d),val,pago:pg,saldo:Math.max(0,val-pg),sit,concluido:true,aprovado:true,baixas:d.baixas||[],pagarEm:d.vencimento||'',data:'',mesAno:mesAnoLabel(d.vencimento||hojeISO())});
    });
  });
  return {total,totalConcluido:aprovado,aprovado,pago,saldo:Math.max(0,aprovado-pago),linhas,eqTotal,eqAprovado,eqPago};
}

// pela ET (ou qualquer outra empresa) deve-se SOLICITAR NF ao colaborador. Não sócios: sempre NF.
function ehPimentel(empId){ const e=DATA.minhasEmpresas.find(x=>x.id===empId); return !!e && (e.nome||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes('pimentel'); }
function tipoDocumento(u,empId){
  if(!empId) return '';
  if(u.socio && ehPimentel(empId)) return 'recibo';
  return 'nf';
}
function valorPorExtenso(v){
  const un=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const ce=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=n=>{ if(n===0) return ''; if(n===100) return 'cem'; const c=Math.floor(n/100), r=n%100; const p=[]; if(c) p.push(ce[c]); if(r){ if(r<20) p.push(un[r]); else { const d=Math.floor(r/10), u2=r%10; p.push(dz[d]+(u2?' e '+un[u2]:'')); } } return p.join(' e '); };
  const int=n=>{ if(n===0) return 'zero'; const mi=Math.floor(n/1e6), mil=Math.floor((n%1e6)/1000), r=n%1000; const p=[];
    if(mi) p.push(ate999(mi)+(mi===1?' milhão':' milhões'));
    if(mil) p.push(mil===1?'mil':ate999(mil)+' mil');
    if(r) p.push(ate999(r));
    return p.reduce((acc,x,i)=>{ if(i===0) return x; const ultimo=i===p.length-1; return acc+((ultimo&&(r>0&&(r<100||r%100===0)||(!r&&mil&&i===p.length-1)))?' e ':' ')+x; },''); };
  const cents=Math.round((Number(v)||0)*100), reais=Math.floor(cents/100), cent=cents%100;
  const partes=[];
  if(reais) partes.push(int(reais)+(reais===1?' real':(reais%1e6===0?' de reais':' reais')));
  if(cent) partes.push(int(cent)+(cent===1?' centavo':' centavos'));
  return partes.length? partes.join(' e ') : 'zero real';
}
