      save(DATA);
      try{ await sbAcesso('criar',email,{senha,colaboradorId:id}); await sbRecarregarAcessos(); CONVITE_ATUAL={nome,email,senha,tel}; logAcao('Colaborador convidado: '+nome); save(DATA); render(); }
      catch(err){ cvB.disabled=false; erro('O colaborador foi cadastrado, mas o acesso não foi criado: '+err.message+'. Abra o cadastro dele para tentar de novo.'); render(); }
    };
    document.querySelectorAll('.acNovo').forEach(b=>b.onclick=async()=>{
      const u=b.dataset.u, em=document.querySelector('.acEmail[data-u="'+u+'"]').value.trim().toLowerCase(); let se=document.querySelector('.acSenha[data-u="'+u+'"]').value;
      if(!em||(se&&se.length<8)){ acMsg(u,'Informe o e-mail e, se digitar a senha, use pelo menos 8 caracteres.'); return; }
      if(!se) se=genSenha();
      b.disabled=true; acMsg(u,'Criando…',true);
      try{ await sbAcesso('criar',em,{senha:se,colaboradorId:u}); await sbRecarregarAcessos(); const cc=DATA.colaboradores.find(x=>x.id===u)||{}; CONVITE_ATUAL={nome:cc.nome||'',email:em,senha:se,tel:cc.telefone||''}; logAcao('Acesso criado para '+colabNome(u)); render(); }
      catch(err){ b.disabled=false; acMsg(u,err.message); }
    });
    document.querySelectorAll('.acReset').forEach(b=>b.onclick=async()=>{
      const u=b.dataset.u; let se=document.querySelector('.acSenha[data-u="'+u+'"]').value;
      if(se&&se.length<8){ acMsg(u,'A senha precisa ter pelo menos 8 caracteres.'); return; }
      const gerada=!se; if(!se) se=genSenha();
      try{ await sbAcesso('senha',b.dataset.e,{senha:se}); document.querySelector('.acSenha[data-u="'+u+'"]').value='';
        if(gerada){ const cc=DATA.colaboradores.find(x=>x.id===u)||{}; CONVITE_ATUAL={nome:cc.nome||'',email:b.dataset.e,senha:se,tel:cc.telefone||''}; render(); }
        else acMsg(u,'Senha redefinida.',true); }
      catch(err){ acMsg(u,err.message); }
    });
    document.querySelectorAll('.acMail').forEach(b=>b.onclick=async()=>{
      b.disabled=true; acMsg(b.dataset.u,'Enviando…',true);
      try{ await sbAcesso('recuperar',b.dataset.e,{redirectTo:location.origin+location.pathname}); acMsg(b.dataset.u,'E-mail enviado para '+b.dataset.e+'.',true); }
      catch(err){ acMsg(b.dataset.u,err.message); }
      b.disabled=false;
    });
    document.querySelectorAll('.acDel').forEach(b=>b.onclick=async()=>{
      if(!confirm('Remover o acesso de '+b.dataset.e+'? O colaborador deixa de conseguir entrar.')) return;
      try{ await sbAcesso('remover',b.dataset.e); await sbRecarregarAcessos(); logAcao('Acesso removido de '+colabNome(b.dataset.u)); render(); }
      catch(err){ acMsg(b.dataset.u,err.message); }
    });
    document.querySelectorAll('.togglecolab').forEach(b=>b.onclick=()=>{OPEN_COLAB=OPEN_COLAB===b.dataset.u?null:b.dataset.u;render();});
    document.querySelectorAll('.gerarrecibo').forEach(b=>b.onclick=()=>{ abrirReciboColaborador(b.dataset.u, b.dataset.mes, b.dataset.e); });
    document.querySelectorAll('.gerarnf').forEach(b=>b.onclick=()=>{ abrirSolicitacaoNF(b.dataset.u, b.dataset.mes, b.dataset.e); });
    document.querySelectorAll('.colabSocio').forEach(c=>c.onchange=e=>{const u=DATA.colaboradores.find(x=>x.id===c.dataset.u); if(u){u.socio=e.target.checked; save(DATA); render();}});
    document.querySelectorAll('.colabCampo').forEach(i=>i.onchange=e=>{const u=DATA.colaboradores.find(x=>x.id===i.dataset.u);u[i.dataset.f]=e.target.value;save(DATA);render();});
    document.querySelectorAll('.delcolab').forEach(b=>b.onclick=()=>{
      const id=b.dataset.u, u=DATA.colaboradores.find(x=>x.id===id); if(!u||colabEmUso(id)) return;
      if(PENDING_DEL!==id){ PENDING_DEL=id; render(); return; }
      PENDING_DEL=''; DATA.colaboradores=DATA.colaboradores.filter(x=>x.id!==id); logAcao('Colaborador removido: '+u.nome); save(DATA); render();
    });
    document.querySelectorAll('.deltipo').forEach(b=>b.onclick=()=>{if(tipoEmUso(b.dataset.t)) return; DATA.tiposServico=DATA.tiposServico.filter(t=>t.id!==b.dataset.t);save(DATA);render();});
    document.getElementById('addTipo').onclick=()=>{
      const nome=document.getElementById('novoTipo').value.trim(); if(!nome) return;
      DATA.tiposServico.push({id:'t'+Date.now(),nome}); save(DATA); render();
    };
    document.querySelectorAll('.empresaCampo').forEach(i=>i.onchange=e=>{const emp=DATA.minhasEmpresas.find(x=>x.id===i.dataset.e);emp[i.dataset.f]=e.target.value;save(DATA);render();});
    document.querySelectorAll('.delempresa').forEach(b=>b.onclick=()=>{DATA.minhasEmpresas=DATA.minhasEmpresas.filter(e=>e.id!==b.dataset.e);DATA.obras.forEach(o=>{if(o.empresaId===b.dataset.e)o.empresaId='';});save(DATA);render();});
    const addEmp=document.getElementById('addEmpresa');
    if(addEmp) addEmp.onclick=()=>{
      DATA.minhasEmpresas.push({id:'emp'+Date.now(),nome:'Nova empresa',cnpj:'',endereco:'',telefone:'',email:''});
      save(DATA); render();
    };
    document.getElementById('addColab').onclick=()=>{
      const nome=document.getElementById('novoNome').value.trim(); if(!nome) return;
      DATA.colaboradores.push({
        id:'u'+Date.now(), nome,
        cargo:document.getElementById('novoCargo').value.trim(),
        documento:document.getElementById('novoDoc').value.trim(),
        telefone:document.getElementById('novoTel').value.trim(),
        email:document.getElementById('novoEmail').value.trim(),
        pix:document.getElementById('novoPix').value.trim(),
        dataInicio:document.getElementById('novoInicio').value
      });
      save(DATA); render();
    };
  }
}
if(SB.on) sbBoot(); else { render(); startSync(); }
</script>
</body>
</html>
